name: Check portfolio
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
      - run: pnpm install --frozen-lockfile
      - run: mise run check-kotlin
      - run: pnpm exec vp fmt --check
      - run: pnpm exec vp lint
      - run: pnpm exec vp run check
      - run: pnpm exec vp run build
